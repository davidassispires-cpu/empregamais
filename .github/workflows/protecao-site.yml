name: Protecao do site
on:
  push:
    branches: [reconstrucao-limpa, main]
  pull_request:
    branches: [reconstrucao-limpa, main]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript do site inteiro
        run: node scripts/validate-site.js
