name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Refresh portal asset versions
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python - <<'PYTHON'
          import os, pathlib, re
          page = pathlib.Path('index.html')
          html = page.read_text()
          for asset in ('empregamais_lote8.js', 'empregamais_lote10.js', 'empregamais_confidencial_definitivo_v1.js', 'site-fonts.css', 'emporio-profissional.css', 'publicacao-painel.css', 'planos-config.js', 'processo-seletivo-etapas.js', 'candidato-demo.js', 'vagas-demo.js', 'vagas-demo.css', 'recent-vacancies.css', 'vagas-recomendadas.js', 'candidato-candidaturas.js', 'candidato-candidaturas-sync.js', 'recruiter-sync-and-reports.js', 'recruiter-preselection.js', 'candidato-preparacao.js', 'candidato-preparacao.css', 'candidato-paleta.css', 'mensagens-chat.js', 'empregamais_endereco_definitivo_v1.js', 'empregamais_controles_vaga_v1.js'):
              html = re.sub(re.escape(asset) + r'\?v=[^\"\']+', asset + '?v=' + os.environ['DEPLOY_SHA'], html)
          html = re.sub(r'<script[^>]+src=[\"\']form-validation\.js[^>]*></script>', '', html)
          # Insert only at the document end; preview templates also contain body tags.
          before_body_end, closing_body, after_body_end = html.rpartition('</body>')
          if not closing_body:
              raise ValueError('Missing document closing body tag')
          html = before_body_end + '<script src="form-validation.js?v=' + os.environ['DEPLOY_SHA'] + '" defer></script>' + closing_body + after_body_end
          page.write_text(html)
          PYTHON
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 1200000




