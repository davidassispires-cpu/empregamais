name: Site Safety

on:
  push:
    branches: [reconstrucao-limpa, main]
  pull_request:
    branches: [reconstrucao-limpa, main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar estrutura e JavaScript critico
        run: node scripts/site-safety-check.mjs
      - name: Validar todos os JavaScripts do site
        shell: bash
        run: |
          set -e
          find novo -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "checking $file"
            node --check "$file"
          done
