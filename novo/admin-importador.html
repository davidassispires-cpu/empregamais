<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Importar vagas | EmpregaMais</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f8;color:#18333a;font:15px Arial,sans-serif}.top{background:#0d4650;color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}.top b{font-size:21px}.top a{color:#fff;text-decoration:none;border:1px solid #ffffff55;padding:10px 14px;border-radius:8px}.wrap{max-width:1180px;margin:28px auto;padding:0 18px}.hero,.card{background:#fff;border:1px solid #dce6e8;border-radius:16px;box-shadow:0 8px 24px #173a4310}.hero{padding:25px;margin-bottom:18px}.hero h1{margin:0 0 8px;font-size:27px}.hero p{margin:0;color:#64777c;line-height:1.55}.card{padding:22px}textarea,input{width:100%;border:1px solid #cbdadd;border-radius:9px;padding:12px;font:inherit}textarea{min-height:260px;resize:vertical}.btn{border:0;border-radius:9px;background:#0d4650;color:#fff;padding:13px 18px;font-weight:800;cursor:pointer;margin-top:12px}.btn:disabled{opacity:.55}.preview{margin-top:20px}.vaga{background:#fff;border:1px solid #dce6e8;border-radius:14px;padding:20px;margin:14px 0}.score{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.score b{font-size:20px;color:#0d4650}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid label,.vaga>label{font-weight:700;font-size:13px}.grid input,.vaga>label textarea{margin-top:6px}.vaga>label{display:block;margin-top:12px}.meta{margin-top:14px;padding:12px;background:#f1f7f7;border-radius:9px;color:#49666d}.actions{display:flex;justify-content:flex-end;margin-top:16px}.notice{padding:12px 14px;background:#fff7dd;border:1px solid #ead78d;border-radius:10px;margin-bottom:16px;color:#6e5b18}@media(max-width:800px){.grid{grid-template-columns:1fr}.top{padding:15px}.score{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="top"><b>EmpregaMais · Importador</b><a href="index.html">← Voltar ao painel</a></header>
<main class="wrap">
<section class="hero"><h1>Importar vagas</h1><p>Ferramenta independente do portal principal. Um erro nesta página não interfere no login, nas vagas ou nos demais botões do EmpregaMais.</p></section>
<section class="card"><div class="notice">Revise os dados antes de cadastrar. O importador nunca publica automaticamente.</div><textarea id="texto" placeholder="Cole aqui o anúncio completo da vaga..."></textarea><button class="btn" id="analisar">Analisar vaga</button><div class="preview" id="preview"></div></section>
</main>
<script>
(function(){
'use strict';
var vagas=[];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function clean(s){return String(s||'').replace(/\*\*/g,'').replace(/\\:/g,':').replace(/\r/g,'').trim()}
function field(t,names){for(var i=0;i<names.length;i++){var m=t.match(new RegExp('(?:^|\\n)\\s*'+names[i]+'\\s*[:\\-]\\s*([^\\n]+)','i'));if(m)return m[1].trim()}return''}
function section(t,names,next){var m=t.match(new RegExp('(?:^|\\n)\\s*(?:'+names+')\\s*:\\s*([\\s\\S]*?)(?=\\n\\s*(?:'+next+')\\s*:|$)','i'));return m?m[1].replace(/^\\s*[-•]\\s*/gm,'').trim():''}
function parse(t,i){
 t=clean(t);var lines=t.split('\n').map(function(x){return x.trim()}).filter(Boolean);
 var cargo=field(t,['Cargo','Vaga','Função','Oportunidade'])||lines[0]||'';
 var local=field(t,['Local de trabalho','Localidade','Local','Cidade']),cidade=local,uf=field(t,['UF','Estado']),bairro='';
 if(local){var ap=local.split(/\s+[–—-]\s+/).map(function(x){return x.trim()}).filter(Boolean);if(ap.length>1){bairro=ap[0];cidade=ap[ap.length-1]}var um=cidade.match(/(?:[-\\/]\s*|\s+)([A-Z]{2})$/);if(um){uf=um[1];cidade=cidade.replace(/(?:[-\\/]\s*|\s+)[A-Z]{2}$/,'').trim()}}
 var contrato=field(t,['Contratação','Contratacao','Contrato','Tipo de contrato','Regime','Vínculo','Vinculo']);
 if(/\bCLT\b/i.test(contrato||t))contrato='Efetivo – CLT';else if(/est[aá]gio/i.test(contrato||t))contrato='Estágio';else if(/tempor[aá]ri/i.test(contrato||t))contrato='Temporário';else if(/jovem aprendiz/i.test(contrato||t))contrato='Jovem Aprendiz';else if(/trainee/i.test(contrato||t))contrato='Trainee';
 var salario=field(t,['Salário','Salario','Remuneração','Remuneracao'])||((t.match(/R\$\s*[\d.,]+/)||[])[0]||'A combinar');
 var empresa=field(t,['Empresa','Contratante','Empresa contratante']);
 var modalidade=field(t,['Modalidade','Modelo de trabalho']);if(!modalidade){if(/home\s*office|remot[oa]/i.test(t))modalidade='Remoto';else if(/h[ií]brid[oa]/i.test(t))modalidade='Híbrido';else modalidade='Presencial'}
 var area=field(t,['Área','Area','Setor']);
 var requisitos=section(t,'Requisitos|Qualificações|Qualificacoes','Local de trabalho|Localidade|Local|Benefícios|Beneficios|Jornada de Trabalho|Jornada|Informações adicionais|Informacoes adicionais|Formas de candidatura|Como se candidatar');
 var descricao=section(t,'Descrição da Vaga|Descrição|Descricao','Requisitos|Qualificações|Qualificacoes|Local de trabalho|Localidade|Local|Benefícios|Beneficios|Jornada de Trabalho|Jornada|Informações adicionais|Informacoes adicionais|Formas de candidatura|Como se candidatar');
 var adicionais=section(t,'Informações adicionais|Informacoes adicionais','Formas de candidatura|Como se candidatar');
 var atividades='';var am=descricao.match(/(?:O que você vai fazer|Atividades|Responsabilidades)\s*:\s*([\s\S]*)/i);if(am){atividades=am[1].trim();descricao=descricao.slice(0,am.index).trim()||descricao}
 var escolaridade=field(t,['Escolaridade','Formação','Formacao']);if(!escolaridade){if(/ensino fundamental completo/i.test(t))escolaridade='Fundamental completo';else if(/ensino m[eé]dio completo/i.test(t))escolaridade='Médio completo';else if(/ensino m[eé]dio (?:cursando|incompleto)/i.test(t))escolaridade='Médio cursando';else if(/superior completo|gradua[cç][aã]o completa/i.test(t))escolaridade='Superior completo';else if(/superior (?:em curso|cursando)|gradua[cç][aã]o em andamento/i.test(t))escolaridade='Superior cursando'}
 var experiencia=field(t,['Experiência','Experiencia','Tempo de experiência','Tempo de experiencia']);if(!experiencia){var ex=t.match(/Experi[eê]ncia\s+em\s+([^.;\n]+)/i);if(ex)experiencia=ex[1].trim()+' — diferencial';else if(/experi[eê]ncia[^.\n]*(?:diferencial|desej[aá]vel)/i.test(t))experiencia='Desejável / diferencial';else if(/sem experi[eê]ncia|n[aã]o exige experi[eê]ncia/i.test(t))experiencia='Não exige experiência'}
 var email=(t.match(/[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}/)||[])[0]||'';
 var wm=t.match(/(?:whatsapp|whats)[^\d+]*(\+?\d[\d\s()-]{8,}\d)/i),whatsapp=wm?wm[1].replace(/\D/g,''):'';
 if(!whatsapp){var wl=t.match(/api\.whatsapp\.com\/send\?phone=(\d+)/i);if(wl)whatsapp=wl[1]}
 var assunto='';var asm=t.match(/(?:com o assunto|assunto)\s*:\s*([^\n]+)/i);if(asm)assunto=clean(asm[1]);
 var candidatura=email&&whatsapp?'E-mail + WhatsApp':email?'E-mail':whatsapp?'WhatsApp':'EmpregaMais';
 var divergencia=assunto&&cargo&&assunto.toLowerCase().indexOf(cargo.toLowerCase())===-1?'Cargo do assunto da candidatura difere do cargo anunciado. Conferir.':'';
 var v={id:i,cargo:cargo,empresa:empresa,area:area,contrato:contrato,modalidade:modalidade,cidade:cidade,uf:uf,bairro:bairro,cep:field(t,['CEP']),salario:salario,escolaridade:escolaridade,experiencia:experiencia,jornada:field(t,['Jornada de Trabalho','Jornada','Horário','Horario']),beneficios:field(t,['Benefícios','Beneficios']),descricao:descricao,atividades:atividades,requisitos:requisitos,adicionais:adicionais,email:email,whatsapp:whatsapp,assunto:assunto,candidatura:candidatura,divergencia:divergencia};
 return infer(v,t)
}
function split(t){var p=clean(t).split(/(?=^\s*(?:Vaga|Cargo|Oportunidade)\s*[:\-])/gim).map(function(x){return x.trim()}).filter(Boolean);return p.length?p:[]}
function completeness(v){var ks=['cargo','empresa','area','contrato','modalidade','cidade','uf','salario','escolaridade','experiencia','jornada','beneficios','descricao','atividades','requisitos','adicionais'],n=ks.filter(function(k){return String(v[k]||'').trim()}).length;return {pct:Math.round(n/ks.length*100),n:n,total:ks.length}}
function infer(v,t){var all=(String(v.cargo||'')+' '+t).toLowerCase();
if(!v.empresa){var em=t.match(/(?:empresa|rede|grupo)\s+([A-ZÁÉÍÓÚÂÊÔÃÕÇ][^\n,.;]{2,60})/i)||t.match(/\b(O Botic[aá]rio)\b/i);if(em)v.empresa=em[1]}
if(!v.area){if(/venda|comercial|consultor de loja|vendedor/.test(all))v.area='Vendas';else if(/atendimento|auxiliar de loja|caixa|recepcion/.test(all))v.area='Atendimento';else if(/estoque|logística|logistica|expedi|almoxarif/.test(all))v.area='Logística';else if(/administrativ|assistente administrativo/.test(all))v.area='Administrativo';else if(/financeir|contab|fiscal/.test(all))v.area='Financeiro';else if(/rh|recursos humanos|recrut/.test(all))v.area='Recursos Humanos';else if(/desenvolvedor|programador|tecnologia|suporte ti|\bti\b/.test(all))v.area='TI e Tecnologia'}
if(!v.escolaridade){if(/ensino fundamental completo/i.test(t))v.escolaridade='Fundamental completo';else if(/ensino m[eé]dio completo/i.test(t))v.escolaridade='Médio completo';else if(/ensino m[eé]dio (?:cursando|incompleto)/i.test(t))v.escolaridade='Médio cursando';else if(/superior completo|gradua[cç][aã]o completa/i.test(t))v.escolaridade='Superior completo';else if(/superior (?:em curso|cursando)|gradua[cç][aã]o em andamento/i.test(t))v.escolaridade='Superior cursando'}
if(!v.experiencia){var ex=t.match(/(?:experi[eê]ncia|experiencia)[^\n:]*[:\-]?\s*([^\n]{2,100})/i);if(ex)v.experiencia=ex[1].trim();else if(/sem experi[eê]ncia|n[aã]o exige experi[eê]ncia/i.test(t))v.experiencia='Não exige experiência';else if(/experi[eê]ncia[^.\n]*(?:diferencial|desej[aá]vel)/i.test(t))v.experiencia='Desejável / diferencial'}
if(!v.beneficios){var be=t.match(/(?:benef[ií]cios?)\s*[:\-]\s*([^\n]+)/i);if(be)v.beneficios=be[1].trim()}
if(!v.jornada){var jo=t.match(/(?:jornada(?: de trabalho)?|hor[aá]rio)\s*[:\-]\s*([^\n]+)/i);if(jo)v.jornada=jo[1].trim()}
return v}
function inp(v,k,l){return '<label>'+l+'<input data-i="'+v.id+'" data-k="'+k+'" value="'+esc(v[k])+'"></label>'}
function render(){var box=document.getElementById('preview');box.innerHTML=vagas.map(function(v){var cp=completeness(v);return '<article class="vaga" data-card="'+v.id+'"><div class="score"><b data-score="'+v.id+'">'+cp.pct+'% preenchido</b><span data-count="'+v.id+'">'+cp.n+' de '+cp.total+' campos · Padrão Plano Grátis · revisão obrigatória</span></div><div class="grid">'+inp(v,'cargo','Cargo')+inp(v,'empresa','Empresa')+inp(v,'area','Área')+inp(v,'contrato','Contrato')+inp(v,'modalidade','Modalidade')+inp(v,'cidade','Cidade')+inp(v,'uf','UF')+inp(v,'bairro','Bairro/região')+inp(v,'cep','CEP')+inp(v,'salario','Salário')+inp(v,'escolaridade','Escolaridade')+inp(v,'experiencia','Experiência')+inp(v,'jornada','Jornada')+inp(v,'beneficios','Benefícios')+'</div><label>Descrição<textarea data-i="'+v.id+'" data-k="descricao">'+esc(v.descricao)+'</textarea></label><label>Atividades / responsabilidades<textarea data-i="'+v.id+'" data-k="atividades">'+esc(v.atividades)+'</textarea></label><label>Requisitos<textarea data-i="'+v.id+'" data-k="requisitos">'+esc(v.requisitos)+'</textarea></label><label>Informações adicionais<textarea data-i="'+v.id+'" data-k="adicionais">'+esc(v.adicionais)+'</textarea></label><div class="meta"><b>Candidatura:</b> '+esc(v.candidatura)+(v.email?' · e-mail interno protegido':'')+(v.whatsapp?' · WhatsApp '+esc(v.whatsapp):'')+(v.assunto?' · Assunto: '+esc(v.assunto):'')+(v.divergencia?'<br><strong>⚠ '+esc(v.divergencia)+'</strong>':'')+'</div><div class="actions"><button class="btn" type="button" data-cadastrar="'+v.id+'">Cadastrar vaga</button></div></article>'}).join('');box.querySelectorAll('[data-i]').forEach(function(el){el.addEventListener('input',function(){var v=vagas[Number(el.dataset.i)];if(v){v[el.dataset.k]=el.value;var cp=completeness(v),s=box.querySelector('[data-score="'+v.id+'"]'),n=box.querySelector('[data-count="'+v.id+'"]');if(s)s.textContent=cp.pct+'% preenchido';if(n)n.textContent=cp.n+' de '+cp.total+' campos · Padrão Plano Grátis · revisão obrigatória'}})});box.querySelectorAll('[data-cadastrar]').forEach(function(btn){btn.addEventListener('click',function(){alert('Revisão concluída. A integração de cadastro será conectada de forma segura ao Supabase na próxima etapa; nenhuma vaga foi publicada automaticamente.')})})}
document.getElementById('analisar').addEventListener('click',async function(){try{vagas=split(document.getElementById('texto').value).map(parse);if(!vagas.length){document.getElementById('preview').innerHTML='<p>Cole um anúncio antes de analisar.</p>';return}await completarTodas(vagas);render()}catch(e){console.error(e);document.getElementById('preview').innerHTML='<p>Não foi possível analisar este anúncio. O restante do EmpregaMais não foi afetado.</p>'}});
})();
</script>
</body></html>
