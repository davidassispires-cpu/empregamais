<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conferência responsiva dos slides</title>
<style>body{margin:0;background:#e8eef5;color:#183b5b;font:14px Poppins,sans-serif}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px;background:#fff;border-bottom:1px solid #cbd7e4}button{border:1px solid #becde0;border-radius:6px;background:#fff;padding:9px 12px;cursor:pointer}.frame-wrap{padding:16px;overflow:auto}iframe{display:block;box-sizing:content-box;width:375px;height:1650px;border:1px solid #bacade;background:#fff;margin:0 auto}</style></head>
<body><div class="toolbar"><strong>Conferência responsiva</strong><button type="button" data-width="320">320 px</button><button type="button" data-width="375">375 px</button><button type="button" data-width="768">768 px</button><button type="button" data-width="1024">1024 px</button><button type="button" data-width="1363">1363 px</button><button type="button" data-height="540">Altura 540</button><button type="button" data-height="700">Altura 700</button><button type="button" data-height="936">Altura 936</button><button type="button" data-audience="paid-demo">Painel pago</button><button type="button" data-audience="free-demo">Painel gratuito</button><button type="button" data-audience="empresa">Empresas</button><button type="button" data-audience="candidato">Candidatos</button></div><div class="frame-wrap"><iframe id="guideFrame" title="Página Como funciona" src="../?pagina=como-funciona&amp;publico=empresa"></iframe></div><script>const frame=document.getElementById('guideFrame');document.addEventListener('click',function(event){const button=event.target.closest('button');if(!button)return;if(button.dataset.width)frame.style.width=button.dataset.width+'px';if(button.dataset.height)frame.style.height=button.dataset.height+'px';if(button.dataset.audience==='paid-demo'){frame.src='../?pagina=demo-recrutador&plano=trimestral';return;}if(button.dataset.audience==='free-demo'){frame.src='../?pagina=demo-recrutador';return;}if(button.dataset.audience)frame.src='../?pagina=como-funciona'+(button.dataset.audience==='empresa'?'&publico=empresa':'');});</script></body></html>
